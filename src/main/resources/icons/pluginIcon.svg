<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Background -->
  <rect width="40" height="40" rx="8" fill="#1E1E2E"/>
  <!-- Document -->
  <rect x="6" y="4" width="22" height="32" rx="3" fill="none" stroke="#555" stroke-width="1.5"/>
  <!-- Chart bars -->
  <rect x="10" y="20" width="4" height="12" rx="1" fill="#4CAF50"/>
  <rect x="16" y="14" width="4" height="18" rx="1" fill="#42A5F5"/>
  <rect x="22" y="17" width="4" height="15" rx="1" fill="#EF5350"/>
  <!-- Header lines -->
  <line x1="10" y1="9" x2="26" y2="9" stroke="#666" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Checkmark badge -->
  <circle cx="33" cy="7" r="5" fill="#4CAF50"/>
  <polyline points="30.5,7 32,8.5 35.5,5" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text: ER -->
  <text x="17" y="39" font-family="Arial,sans-serif" font-size="4" font-weight="bold" fill="#8b949e" text-anchor="middle">ENES REPORT</text>
